# Partner API v1 — public contract for external partners (Glamping.cz first).
#
# This file is the source of truth for `partner-zod` codegen
# (lib/api-spec/orval.config.ts) and for the published docs site
# (artifacts/partner-docs/). It is intentionally SEPARATE from the internal
# `openapi.yaml`: that one describes the admin/booking-engine API and must
# never be published outside the company; this one is meant to leave the
# building.
#
# Everything here is in English on purpose — it's a contract with a third
# party, not an internal tool.
#
# ── Dates and timestamps: read this before adding a field ──────────────────
# The `zod` orval project (and this file's `partner-zod` sibling) runs with
# `useDates: true`. Orval turns any *plain* `type: string` property with
# `format: date` or `format: date-time` into `zod.date()` — a schema that only
# accepts a real JS `Date` instance, not a JSON string. That's fine for
# request bodies the server pre-converts before `.parse()` (see
# `routes/bookings/crud.ts`'s `bodyWithDates`), but it does NOT match what a
# route actually puts on the wire: `res.json()` sends strings, always.
# `GET /units`'s own `generated_at` is a concrete example — the route builds
# it with `new Date().toISOString()`, i.e. a string, not a Date object.
# Validating that real value against a `zod.date()` schema fails every time.
#
# So, deliberately, in THIS file:
#   - a computed response timestamp (e.g. `generated_at`) is a bare
#     `type: string` with NO `format` — orval then emits plain `zod.string()`,
#     which matches what the route actually returns.
#   - a calendar date on a DEPLOYED endpoint — request or response body
#     (`AriDay.date`, the quote's `check_in` / `check_out` / `nightly[].date`)
#     — is `type: string` with a `YYYY-MM-DD` pattern, never `format: date`:
#     the wire value is a plain string both ways, and the generated validator
#     has to accept exactly that. A timestamp on a deployed endpoint
#     (`expires_at`, `created_at`, milestone `from` / `until`) is a bare
#     `type: string` like `generated_at` above.
#   - `planned` endpoints (reservation modify, webhooks) still use
#     `format: date` / `format: date-time`, matching the rest of this repo's
#     contract convention (`CreateBookingBody.checkIn`). No route depends on
#     that shape yet; whoever deploys one switches it to the two rules above
#     in the same change, as `GET /ari` (1.1.0), the quote endpoints (1.2.0),
#     the reservation confirm / lookup / list endpoints (1.3.0) and
#     reservation cancel (1.4.0) did.
#   - a date used as a QUERY PARAMETER never uses `format: date` (query
#     strings are always strings; `useDates` would make them `zod.date()`
#     with no coercion). It uses `type: string` with a `YYYY-MM-DD` pattern
#     instead — see `ListHousekeepingTasksQueryParams` in the internal spec
#     for the existing precedent.
openapi: 3.1.0
info:
  title: GlampSys Partner API
  version: 1.4.0
  description: |
    The GlampSys Partner API lets a booking channel (Glamping.cz first) read
    unit availability and rates, price a stay, hold inventory, and confirm,
    modify or cancel a reservation — without touching the GlampSys admin
    panel.

    ## Status of this document

    This contract already describes every endpoint planned for the first
    release. Endpoints not yet live are marked `x-status: planned` on
    the operation and say so again in their description. Calling one today
    returns `404 NOT_FOUND` in the standard error envelope with
    `error.details.reason` set to `UNKNOWN_ENDPOINT` — that `reason` is how you
    tell "not deployed yet" apart from a 404 for a unit, quote or reservation
    that does not exist. Build against the whole contract; GlampSys will
    announce each endpoint's go-live in the changelog.

    ## Authentication

    Every request carries `Authorization: Bearer <token>`. Tokens are issued
    per partner and come in two independent, non-interchangeable pairs:

    - `gsp_live_…` — production. Reads and writes real units, real guests,
      real money.
    - `gsp_test_…` — sandbox. Scoped to a dedicated demo property with fake
      units; nothing it touches is ever real. Use it for integration testing
      and for Glamping.cz's own CI.

    A token that fails to authenticate returns `401 UNAUTHORIZED`. A token
    that authenticates but whose partner account is paused, or whose request
    comes from an IP outside that partner's allow-list, returns
    `403 FORBIDDEN`.

    ## Idempotency

    Every write operation (`POST /quotes` with `hold: true`,
    `POST /reservations/confirm`, `POST /reservations/{id}/modify`,
    `POST /reservations/{id}/cancel`) requires an `Idempotency-Key` header.
    Retry a request with the same key and the same body and you get back the
    original result, never a duplicate hold, reservation, or charge. Retry
    with the same key and a *different* body and the request is rejected with
    `409 IDEMPOTENCY_KEY_REUSED`. `POST /quotes` with `hold: false` creates no
    state (it only returns a price), so the header is not required there.

    Generate a fresh key per logical action (e.g. per "user clicked confirm"),
    not per HTTP attempt — retries of the *same* action should reuse the same
    key.

    The details, so a retry loop can be written without guessing:

    - A key is 1–255 printable ASCII characters (`0x20`–`0x7E`). Anything
      else is `400 INVALID_REQUEST` with `error.details.header` set to
      `Idempotency-Key`. An empty header counts as a missing one
      (`400 IDEMPOTENCY_KEY_REQUIRED`).
    - Keys are scoped to your partner account **and** to the token's
      environment: the same key used with a sandbox token and with a
      production token are two unrelated keys.
    - "The same request" means the same endpoint, path parameters, query
      and JSON body; key order inside the body does not matter.
    - A replayed response carries the header `Idempotent-Replayed: true`. Its
      body is the stored original byte for byte, so a replayed error still
      carries the `error.request_id` of the **original** request, while the
      `X-Request-ID` header names the retry.
    - If the original request is still being processed, the retry gets
      `409 IDEMPOTENCY_KEY_REUSED` with `error.details.state` set to
      `in_progress`. Wait and retry with the same key; once the original
      finishes you get its stored response. A request abandoned mid-flight
      (for example by a crashed server) is taken over by the next retry
      after 60 seconds.
    - Successful (`2xx`) responses and deterministic rejections (`4xx`) are
      stored and replayed for 48 hours. Two kinds of response are **not**
      stored, so retrying with the same key does real work again: server
      errors (`5xx`) and `429` (rate limit or hold cap — both clear up on
      their own; honour `Retry-After`).

    ## Request correlation

    Every response, success or error, carries `X-Request-ID`. Error bodies
    repeat it as `error.request_id`. Include it whenever you contact GlampSys
    support about a specific call — without it, an incident cannot be found
    in the logs.

    ## Rate limits

    Limits are per partner, not per token, and are enforced independently per
    class of endpoint: reads (`GET` requests), quoting (`POST /quotes`), and
    writes (everything else that mutates state). Exhausting the quote limit —
    for example because a bot hammered your search page — never blocks a
    reservation confirmation; a guest who already paid is never rejected for
    rate-limit reasons. Exceeding a limit returns `429 RATE_LIMITED` with a
    `Retry-After` header (seconds) and `error.details.class` naming which
    limit was hit.

    `POST /quotes` with `hold: true` has a second, separate cap: the number
    of holds you may have active at once — overall (per environment) and per
    unit. Hitting it also returns `429 RATE_LIMITED`, but with
    `error.details.rule` set to `HOLD_LIMIT` instead of `details.class`, and
    `Retry-After` set to the seconds until your oldest active hold in that
    scope expires. `DELETE /quotes/{quote_id}` frees a slot immediately.

    ## Errors

    Every error response has the same envelope:

    ```json
    {
      "error": {
        "code": "NOT_FOUND",
        "message": "Human-readable, for your logs — do not pattern-match on it.",
        "request_id": "req_01J9Z8QXG3K4M5N6P7Q8R9S0T1",
        "details": {}
      }
    }
    ```

    Branch your integration on `error.code`, never on `error.message` (its
    wording may change) or on the HTTP status alone (several codes share a
    status). This contract fixes the HTTP status for every code:

    | HTTP | `error.code` |
    |---|---|
    | 400 | `INVALID_REQUEST`, `IDEMPOTENCY_KEY_REQUIRED` |
    | 401 | `UNAUTHORIZED` |
    | 403 | `FORBIDDEN` |
    | 404 | `NOT_FOUND` |
    | 409 | `CONFLICT`, `UNAVAILABLE`, `PRICE_MISMATCH`, `QUOTE_ALREADY_USED`, `IDEMPOTENCY_KEY_REUSED` |
    | 410 | `QUOTE_EXPIRED` |
    | 413 | `PAYLOAD_TOO_LARGE` |
    | 422 | `BUSINESS_RULE_VIOLATION` |
    | 429 | `RATE_LIMITED` |
    | 500 | `INTERNAL_ERROR` |
    | 503 | `TEMPORARILY_UNAVAILABLE` |

    ## Money

    All prices are integers in **minor units** (haléře for CZK, cents for
    EUR) — never floats. `2099` CZK-minor means `20.99 Kč`. Dates are
    `YYYY-MM-DD`. Timestamps you receive are ISO 8601 UTC strings. Weekdays
    (`allowed_checkin_weekdays`, `allowed_checkout_weekdays`) are ISO 8601:
    `1` = Monday … `7` = Sunday; `null` always means "no restriction", never
    "none allowed".

    ## Forward compatibility

    GlampSys may add new object fields, new `error.code` values, and new
    webhook event types without bumping `info.version`. A client that fails
    on an unrecognized field, enum member, or property it didn't ask for is
    not compliant with this contract — ignore what you don't understand.
    Removing or renaming an existing field, or changing an endpoint's
    meaning, is a breaking change and bumps the major version.
  contact:
    name: GlampSys
    email: partners@glampsys.cz
  license:
    name: Proprietary — GlampSys s.r.o.
    identifier: LicenseRef-GlampSys-Partner-Agreement
servers:
  - url: https://glampsys.cz/api/partner/v1
    description: Production and sandbox share this host; the token's prefix
      (`gsp_live_` vs `gsp_test_`) selects the environment, not the URL.
tags:
  - name: Units
    description: The catalog of units the partner is mapped to, and the
      static booking conditions each one carries.
  - name: ARI
    description: Availability, rates and restrictions — per unit, per day.
  - name: Quotes
    description: Priced, optionally held, quotes for a unit and date range.
      A quote is the only way to create a reservation.
  - name: Reservations
    description: The reservation lifecycle after a quote is confirmed —
      lookup, modification and cancellation.
  - name: Meta
    description: Integration health checks that do not touch inventory.
security:
  - partnerToken: []
paths:
  /units:
    get:
      operationId: listUnits
      tags: [Units]
      summary: List the units mapped to this partner
      description: |
        Returns every unit this partner is actively mapped to in the calling
        token's environment (sandbox tokens only ever see the demo property's
        units). A unit whose location the property owner has paused is
        omitted entirely, not returned with `active: false` — use
        `GET /ari` and `POST /quotes` error responses to detect a location
        that was active a moment ago and no longer is.

        The response never includes guest-facing or security-sensitive
        fields (access codes, arrival instructions, parking coordinates) —
        those belong to a confirmed guest, not to the partner.

        Supports conditional requests: send back the `ETag` you received as
        `If-None-Match` and get `304 Not Modified` with no body when nothing
        changed.
      responses:
        "200":
          description: The partner's unit catalog. Can be an empty array.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitsListResponse"
              example:
                units:
                  - unit_id: unit_123
                    partner_unit_id: GCZ-8842
                    property:
                      property_id: prop_7
                      name: Glamping Posázaví
                      slug: posazavi
                    name: Cabin 1
                    max_guests: 4
                    beds: 2
                    inventory:
                      mode: individual
                      quantity: 1
                    season:
                      seasonal: false
                      from: null
                      to: null
                    conditions:
                      check_in_time: "15:00"
                      check_out_time: "10:00"
                      default_min_stay: 2
                      booking_window_months: 12
                      allowed_checkin_weekdays: null
                      allowed_checkout_weekdays: null
                      cancellation_rules:
                        - days_before_checkin: 7
                          charge_percent: 0
                      terms_url: "https://example.com/terms"
                      terms_text: null
                      cancellation_policy_url: "https://example.com/storno"
                      cancellation_policy_text: null
                      local_tax:
                        mode: in_price
                        per_person_per_night_minor: 2100
                    active: true
                generated_at: "2026-09-10T08:00:00.000Z"
        "304":
          description: Not modified — the ETag you sent matches. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ari:
    get:
      operationId: getAri
      tags: [ARI]
      summary: Get availability, rate and restriction data per day
      description: |
        Returns, for each requested unit and each day in range: whether it is
        available, the remaining pool count, the minimum stay that applies if
        a stay started that day, and whether arrival/departure is allowed
        that weekday.

        `available` and `available_count` are the same numbers the GlampSys
        booking engine shows a guest on the web for that day, computed by the
        same code — so a day you can see here is a day the operator can sell.

        **`price` is indicative, not binding.** It is one night starting that
        day, taken from the rate plan (including any dynamic pricing) with
        your line's `price_markup_percent` applied and rounded to whole CZK.
        It deliberately does **not** include promotions: those depend on the
        length and timing of the actual stay, so they can only be resolved by
        `POST /quotes`, which is the binding price. It is also the price for
        the unit's included occupancy: where the operator prices by the number
        and ages of guests, the quote adds the per-guest surcharges for the
        actual group. A quote can therefore come out below or above the sum of
        the nights you see here.

        `price` is `null` when the unit is not available that day, and when
        you ask for `EUR` on a line that does not have it enabled with a
        fixed exchange rate — `price_unavailable_reason` tells the two apart.

        The booking window is **not** applied here: a day beyond the
        operator's booking window can still read as available, exactly as it
        does on the web. `GET /units` gives you `booking_window_months` per
        unit if you want to grey those days out yourself; `POST /quotes`
        enforces it.

        Supports conditional requests the same way as `GET /units`.
      parameters:
        - name: unit_id
          in: query
          required: true
          description: One or more `unit_id` values from `GET /units`.
            Repeat the parameter for multiple units, e.g.
            `?unit_id=unit_123&unit_id=unit_124`.
          schema:
            type: array
            items:
              type: string
            minItems: 1
          style: form
          explode: true
        - name: from
          in: query
          required: true
          description: First day of the range, inclusive.
          schema:
            $ref: "#/components/schemas/DateQueryParam"
        - name: to
          in: query
          required: true
          description: Last day of the range, inclusive. Maximum 366 days
            counting both ends; a longer range is a `400`.
          schema:
            $ref: "#/components/schemas/DateQueryParam"
        - name: currency
          in: query
          required: false
          description: |
            Currency for `price`. `EUR` is only honoured on a line that has
            EUR enabled with a fixed exchange rate; on any other line every
            day comes back with a null `price` and a
            `price_unavailable_reason` of `CURRENCY_NOT_ENABLED`, rather than
            being silently priced in CZK.
          schema:
            allOf:
              - $ref: "#/components/schemas/Currency"
            default: CZK
      responses:
        "200":
          description: Per-unit, per-day availability and pricing.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              $ref: "#/components/headers/CacheControlShort"
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AriResponse"
              example:
                units:
                  - unit_id: unit_123
                    days:
                      - date: "2026-10-01"
                        available: true
                        available_count: 1
                        min_stay: 2
                        arrival_allowed: true
                        departure_allowed: true
                        price:
                          amount_minor: 210000
                          currency: CZK
                        price_unavailable_reason: null
                      - date: "2026-10-02"
                        available: false
                        available_count: 0
                        min_stay: 2
                        arrival_allowed: true
                        departure_allowed: true
                        price: null
                        price_unavailable_reason: null
                generated_at: "2026-09-10T08:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes:
    post:
      operationId: createQuote
      tags: [Quotes]
      summary: Price a stay, optionally holding inventory
      description: |
        Prices a unit for a date range the same way the public booking engine
        does — same rates (including dynamic pricing), same automatic
        promotions, same local-tax rule — with your line's
        `price_markup_percent` applied, and, when `hold: true`, atomically
        reserves the inventory for a short window so the stay cannot be sold
        out from under you while the guest completes checkout with you.

        **`hold: true`** reserves the dates and returns `201` with a
        `quote_id`, `status: "held"` and `expires_at`. The hold lasts
        `hold_ttl_seconds` (your account's setting, 1800 seconds unless agreed
        otherwise, between 300 and 3600). It is serialized against every other
        sale of the same unit — a guest booking on the operator's own website,
        another of your quotes — so of two requests for the last free unit
        exactly one gets the hold and the other `409 UNAVAILABLE`. A hold that
        is never confirmed or released expires on its own and frees the dates
        within about a minute; release it earlier with
        `DELETE /quotes/{quote_id}` as soon as you know the guest left.
        `Idempotency-Key` is required.

        **`hold: false`** returns `200` with the same price and the same
        checks, against live availability, without reserving anything:
        `status: "priced"`, `quote_id: null`, `expires_at: null`. Use it for
        a price check on your listing page. It does not need an
        `Idempotency-Key`, ignores one if sent, and does not count towards
        the hold cap. A `priced` quote cannot be confirmed — only a held one
        can.

        **Checks, in this order — the first failing one is returned:**

        | Check | Error |
        |---|---|
        | JSON shape, required fields, real calendar dates, `check_out` after `check_in` (at most 366 nights), `currency` is `CZK` or `EUR` | `400 INVALID_REQUEST` |
        | `Idempotency-Key` present when `hold: true` | `400 IDEMPOTENCY_KEY_REQUIRED` |
        | the requested currency is enabled on the unit's line (`EUR` needs a fixed exchange rate) | `422 BUSINESS_RULE_VIOLATION`, `details.rule = CURRENCY` |
        | `guest` sent with `hold: false` | `400 INVALID_REQUEST` |
        | the unit is mapped to you and active | `404 NOT_FOUND` (or `403 FORBIDDEN` when its location is paused) |
        | `adults + children` fits the unit's `max_guests` | `422`, `details.rule = CAPACITY` |
        | arrival within the booking window, and not in the past (Prague calendar day) | `422`, `details.rule = BOOKING_WINDOW` |
        | every night inside the unit's season | `422`, `details.rule = OUT_OF_SEASON` |
        | arrival / departure weekday allowed | `422`, `details.rule = ARRIVAL_DAY` / `DEPARTURE_DAY` |
        | minimum stay (the rate's minimum, lowered for a single-night gap) | `422`, `details.rule = MIN_STAY` |
        | every night has a configured price | `409 UNAVAILABLE`, `details.reason = PRICE_NOT_CONFIGURED` |
        | the dates are free (for a pool unit: at least one unit free every night) | `409 UNAVAILABLE` |
        | your hold caps (`hold: true` only) | `429 RATE_LIMITED`, `details.rule = HOLD_LIMIT` |

        Every `422` carries the rule's limit in `details` (for example
        `min_nights`, `max_guests`, `latest_check_in`, `allowed_weekdays`) so
        you can explain the refusal to the guest without another call.

        **Hold caps.** Your account allows a number of concurrently held
        quotes per environment (`scope: "partner"`, 200 unless agreed
        otherwise) and per unit (`scope: "unit"`, 3 unless agreed otherwise).
        A held quote stops counting the moment it expires, is released or is
        confirmed. Over a cap: `429 RATE_LIMITED` with
        `details: { rule: "HOLD_LIMIT", scope, limit }` and `Retry-After`
        until your oldest hold in that scope expires.

        **Money.** `breakdown` sums to `total_price_minor`. In `CZK`, every
        night is marked up and rounded to whole crowns before it is added
        up, the promotion line is marked up and rounded on its own, and the
        local tax (`fee × all guests × nights`, never marked up) is a line of
        its own when your line collects it (`taxes.local_tax.included`). In
        `EUR`, the CZK total is converted once at the line's fixed rate
        (fixed into `fx_rate` for the life of the quote) and rounded to
        cents; the promotion and local-tax lines are converted on their own
        and the accommodation line takes the rounding remainder, so the lines
        still sum to the total exactly. `nightly` is informational — in `EUR`
        its sum can differ from the accommodation line by a few cents.

        **Guests and price.** Where the operator prices by the number and ages
        of guests, the nightly price includes per-guest surcharges for the
        group you send — `adults` and the age of every child on the arrival
        day — exactly as the public booking engine prices the same group. The
        surcharges are part of the nights (and so of `accommodation`), not a
        separate line. Where the operator does not price by guests, the group
        only affects capacity checks and the local tax. Always send the real
        group: a quote for two adults is not valid for four.

        **Pets** (`guests.pets`) are accepted and stored but never priced.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: "Required when `hold: true`; ignored when `hold: false`."
          schema:
            $ref: "#/components/schemas/IdempotencyKeyValue"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteBody"
            example:
              unit_id: unit_123
              check_in: "2026-10-01"
              check_out: "2026-10-04"
              guests:
                adults: 2
                children: [8]
                pets: 0
              currency: CZK
              hold: true
              guest:
                first_name: Jana
                last_name: Nováková
                email: jana.novakova@example.com
                phone: "+420700123456"
                language: cs
      responses:
        "201":
          description: "Quote created and inventory held (`hold: true`)."
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                quoteHeld:
                  $ref: "#/components/examples/QuoteHeld"
        "200":
          description: "Price only, nothing held (`hold: false`)."
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                quotePriced:
                  $ref: "#/components/examples/QuotePriced"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Unavailable"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /quotes/{quote_id}:
    parameters:
      - name: quote_id
        in: path
        required: true
        description: Opaque id returned by `POST /quotes` (`q_<ULID>`).
        schema:
          type: string
          example: q_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    get:
      operationId: getQuote
      tags: [Quotes]
      summary: Look up a previously created quote
      description: |
        Returns a held quote you created — the price exactly as it was quoted
        (later rate changes never touch it) and its current `status`:
        `held`, `expired`, `cancelled` or `confirmed`.

        A hold whose `expires_at` has passed is reported as `expired` even
        if the background sweep has not released it yet; from that moment it
        no longer holds the dates for you and no longer counts towards your
        hold cap. An expired quote is still returned here, and for 24 hours
        after `expires_at` it can still be confirmed if the dates are still
        free (late payment — see `POST /reservations/confirm`); after that,
        confirming it is `410 QUOTE_EXPIRED`.

        A quote created with another partner's token, or with the other
        environment's token (sandbox vs. production), is `404 NOT_FOUND`.
        `priced` quotes (`hold: false`) have no id and cannot be looked up.
      responses:
        "200":
          description: The quote, in its current state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                quoteHeld:
                  $ref: "#/components/examples/QuoteHeld"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: cancelQuote
      tags: [Quotes]
      summary: Release a held quote before it expires
      description: |
        Releases the inventory hold immediately instead of waiting for the
        quote to expire on its own — use it as soon as you know the guest
        abandoned checkout. The dates are free again for everyone (your own
        `GET /ari`, the operator's website, other channels) and the slot in
        your hold cap is freed.

        Returns the quote in its new current state — the same body as
        `GET /quotes/{quote_id}`. Idempotent: releasing an already-cancelled
        or already-expired quote returns `200` again with its current status
        (`cancelled` or `expired`), not an error. A hold whose `expires_at`
        has already passed is reported as `expired`, not `cancelled`.
        Releasing a quote that was already confirmed into a reservation is
        rejected (`409 QUOTE_ALREADY_USED`) — cancel the reservation instead.
        No `Idempotency-Key` is needed.
      responses:
        "200":
          description: The quote is no longer held (released now, or earlier).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                quoteCancelled:
                  $ref: "#/components/examples/QuoteCancelled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/QuoteAlreadyUsed"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reservations/confirm:
    post:
      operationId: confirmReservation
      tags: [Reservations]
      summary: Confirm a held quote into a reservation
      description: |
        Turns a held quote into a real reservation. The guest has already
        paid you at this point — GlampSys records the reservation as paid on
        confirmation, never charges the guest again and never issues an
        automatic invoice or payment reminder for it; you are the merchant of
        record for this booking.

        **The price is the quote's price.** GlampSys does not re-price the
        stay at confirmation: the reservation gets exactly the total that was
        quoted (and frozen) in `POST /quotes`, in the quote's currency and at
        the quote's fixed exchange rate. You tell GlampSys what the guest
        actually paid (`payment`); it must be in the quote's currency and
        within your account's price tolerance of `total_price_minor` (zero
        unless agreed otherwise), otherwise the confirmation is rejected with
        `409 PRICE_MISMATCH` and nothing is created. A difference inside the
        tolerance is accepted and recorded for the operator.

        `Idempotency-Key` is required. Retrying the same key with the same
        body after a network timeout returns the same reservation (with
        `Idempotent-Replayed: true`), never a second one.

        **Late payment (confirming after the hold expired).** Your payment
        flow may finish after `expires_at` — the hold lasts about 30 minutes
        and a guest can take longer. A quote whose hold has expired is
        therefore *not* rejected automatically: for **24 hours after
        `expires_at`** GlampSys re-checks, under the same lock every other
        sale of the unit takes, whether the stay can still be sold — the
        unit is still mapped to you and active, the location is not paused,
        every night is still in season, arrival is not in the past and the
        dates are still free (for a pool unit: one unit free every night). If
        so, the reservation is created at the quoted price, exactly as if the
        hold had still been there. If not, the answer is `409 UNAVAILABLE`
        with `details.reason = "HOLD_EXPIRED"` — nothing is created and you
        refund the guest. After the 24-hour window the quote is
        `410 QUOTE_EXPIRED`; a quote you released yourself with
        `DELETE /quotes/{quote_id}` is `410 QUOTE_EXPIRED` straight away,
        with `details.status = "cancelled"`.

        **Checks, in this order — the first failing one is returned:**

        | Check | Error |
        |---|---|
        | JSON shape, required fields, `consents.terms` and `consents.gdpr` both `true`, `payment.status` is `paid`, real timestamps, `partner_reservation_id` format | `400 INVALID_REQUEST` (`details.field`) |
        | `Idempotency-Key` present | `400 IDEMPOTENCY_KEY_REQUIRED` |
        | `quote_id` is a held quote you created with this environment's token | `404 NOT_FOUND` |
        | the quote is not already confirmed | `409 QUOTE_ALREADY_USED` |
        | the quote was not released by you, and its hold expired less than 24 hours ago | `410 QUOTE_EXPIRED` (`details.status`) |
        | the unit is still mapped to you and active | `404 NOT_FOUND` (or `403 FORBIDDEN` when its location is paused for you) |
        | `partner_reservation_id` not used before by your account | `409 CONFLICT` |
        | `payment.currency` equals the quote's currency | `409 PRICE_MISMATCH` |
        | `payment.total_price_minor` within your tolerance of the quote's `total_price_minor` | `409 PRICE_MISMATCH` |
        | late payment only: the stay can still be sold (see above) | `409 UNAVAILABLE`, `details.reason = HOLD_EXPIRED` |
        | the location's owner has not paused sales over the held dates | `409 UNAVAILABLE`, `details.reason = SALES_PAUSED` |

        A sales pause the owner sets while your hold is running covers the
        hold: the dates stay closed when the hold ends, and a confirmation
        inside the pause is refused (`SALES_PAUSED`) — refund the guest.

        **Guest emails.** After confirmation GlampSys may email the guest,
        in `guest.language`, according to the email policy agreed for each
        location you are linked to: a booking confirmation without any
        payment details (it names you and your `partner_reservation_id`, and
        links the guest's online check-in portal), arrival instructions and
        other stay emails, or nothing at all. GlampSys never sends a guest of
        a partner reservation a payment request, reminder or invoice, and
        never emails anyone before confirmation. Sandbox reservations send
        no guest email at all. `guest_portal_url` in the response is the same
        portal link — hand it to the guest yourself if you send your own
        confirmation.

        A sandbox token confirms sandbox quotes into sandbox reservations
        (demo location only); they never become visible to a production
        token, and vice versa.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/IdempotencyKeyValue"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmReservationBody"
            example:
              quote_id: q_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              partner_reservation_id: GCZ-938482
              partner_reservation_reference: GCZ-ORDER-99182
              guest:
                first_name: Jana
                last_name: Nováková
                email: jana.novakova@example.com
                phone: "+420700123456"
                language: cs
                nationality: CZ
              consents:
                terms: true
                gdpr: true
                accepted_at: "2026-09-10T08:04:30.000Z"
                source: glamping_cz_checkout
                terms_url: "https://glamping.cz/terms"
                cancellation_policy_url: "https://glamping.cz/storno"
              payment:
                status: paid
                total_price_minor: 648900
                currency: CZK
                paid_at: "2026-09-10T08:04:52.000Z"
              notes: "We will arrive around 18:00."
      responses:
        "201":
          description: Reservation created (or, for a replayed
            `Idempotency-Key`, the reservation created by the original
            request).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              examples:
                reservationConfirmed:
                  $ref: "#/components/examples/ReservationConfirmed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ConfirmConflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reservations:
    get:
      operationId: listReservations
      tags: [Reservations]
      summary: List your reservations changed since a point in time
      description: |
        Reconciliation feed: every reservation of yours (in this token's
        environment) whose record changed at or after `updated_since`,
        oldest change first — confirmations, modifications, cancellations,
        completed stays. Sorted by the time of the last change and then by
        an internal tie-breaker, so the order is stable while you page.

        Page through with `cursor`: pass the previous page's `next_cursor`
        unchanged (it is opaque — do not build or parse it) and keep the
        same `updated_since`. `next_cursor` is `null` on the last page. A
        reservation that changes again while you page moves to the end of
        the feed, so you may see it twice — treat the feed as "at least
        once" and upsert by `reservation_id`.

        A good loop: remember the largest `updated_at` you have processed,
        and on the next run ask for `updated_since` = that value. This
        endpoint complements webhooks; it does not replace
        `GET /reservations/{partner_reservation_id}` for a single lookup.
      parameters:
        - name: updated_since
          in: query
          required: false
          description: ISO 8601 timestamp with a time zone (e.g.
            `2026-10-01T00:00:00Z`). Only reservations changed at or after
            this instant are returned. Omitted = from the beginning.
          schema:
            type: string
            example: "2026-10-01T00:00:00Z"
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page, unchanged.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, 1–200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One page of the feed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationsListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reservations/{partner_reservation_id}:
    parameters:
      - $ref: "#/components/parameters/PartnerReservationIdPath"
    get:
      operationId: getReservation
      tags: [Reservations]
      summary: Look up a reservation
      description: |
        Returns the reservation as GlampSys currently has it: `status`
        (`confirmed`, `modified` — its unit or dates were changed after
        confirmation, `cancelled`, or `completed` — the stay is over), its
        dates and guests, the price you confirmed, and — once cancelled — the
        cancellation fee in your currency and when it was cancelled.

        A reservation made with another partner's token, or with the other
        environment's token (sandbox vs. production), is `404 NOT_FOUND`.
      responses:
        "200":
          description: The reservation.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              examples:
                reservationConfirmed:
                  $ref: "#/components/examples/ReservationConfirmed"
                reservationCancelled:
                  $ref: "#/components/examples/ReservationCancelled"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reservations/{partner_reservation_id}/modify:
    post:
      operationId: modifyReservation
      x-status: planned
      tags: [Reservations]
      summary: Apply a re-priced quote to an existing reservation
      description: |
        **Status: planned, not yet deployed.**

        Changes a confirmed reservation's dates, unit and/or guest count.
        Modification is two steps, not one call: first price the change with
        `POST /quotes`, passing this reservation's
        `partner_reservation_id` as `modifies_partner_reservation_id` so the
        new quote's availability check excludes the reservation's own
        current nights; then confirm that quote here. A reservation that is
        already `cancelled` or `completed` cannot be modified
        (`409 CONFLICT`).
      parameters:
        - $ref: "#/components/parameters/PartnerReservationIdPath"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/IdempotencyKeyValue"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifyReservationBody"
            example:
              quote_id: q_01J9Z8QXG3M0P1Q2R3S4T5V6W7
      responses:
        "200":
          description: Reservation updated.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              examples:
                reservationConfirmed:
                  $ref: "#/components/examples/ReservationConfirmed"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /reservations/{partner_reservation_id}/cancel:
    post:
      operationId: cancelReservation
      tags: [Reservations]
      summary: Cancel a confirmed reservation
      description: |
        Cancels the reservation and releases its inventory: the nights are
        free again in `GET /ari`, on the property's own website and on every
        other channel the property sells through. The response is the
        reservation as `GET /reservations/{partner_reservation_id}` returns
        it, now with `status: cancelled`, `cancellation_fee_minor` and
        `cancelled_at`.

        **Money stays with you.** GlampSys never refunds the guest and never
        charges a cancellation fee — you collected the payment and you own
        the refund. `cancellation_fee_minor` is what the property's
        cancellation policy charges for cancelling now, in the reservation's
        `currency`, and it is computed exactly like the quote's
        `cancellation_milestones`: cancelling at instant `t` costs the
        `charge_minor` of the milestone band containing `t`. GlampSys records
        it as the property's retained revenue; you settle it with the
        property under your agreement.

        **The guest hears nothing from GlampSys about the cancellation** —
        whatever email policy the property has agreed with you. Pending
        pre-arrival and stay emails are withdrawn. Tell the guest yourself.

        **Idempotent.** Retrying with the same `Idempotency-Key` and body
        replays the original response. Cancelling an already cancelled
        reservation again — with any key — returns `200` with its current
        state and no new fee. A reservation the property cancelled itself is
        returned the same way.

        A `completed` reservation (the stay is over: departure day has
        passed) cannot be cancelled: `409 CONFLICT` with
        `details.reason = RESERVATION_COMPLETED`. Cancelling during the stay
        is allowed (the policy's last band applies). A reservation made with
        another partner's token, or with the other environment's token
        (sandbox vs. production), is `404 NOT_FOUND`. A paused property link
        or an unmapped unit does not block cancelling a reservation you
        already have.
      parameters:
        - $ref: "#/components/parameters/PartnerReservationIdPath"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            $ref: "#/components/schemas/IdempotencyKeyValue"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelReservationBody"
            example:
              reason: guest_changed_plans
      responses:
        "200":
          description: Reservation cancelled (or it already was).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Idempotent-Replayed:
              $ref: "#/components/headers/IdempotentReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
              examples:
                reservationCancelled:
                  $ref: "#/components/examples/ReservationCancelled"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CancelConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ping:
    get:
      operationId: ping
      tags: [Meta]
      summary: Verify the integration is alive
      description: |
        A cheap, side-effect-free check: is this token valid, which
        environment does it resolve to, and how many units does it currently
        see. Use it as a connectivity smoke test — it never touches
        inventory, pricing, or the rate limiter's write class.
      responses:
        "200":
          description: The token is valid and this is what it resolves to.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
              example:
                partner: glamping_cz
                environment: production
                unit_count: 12
                request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
                generated_at: "2026-09-10T08:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

webhooks:
  reservation.cancelled:
    post:
      operationId: webhookReservationCancelled
      x-status: planned
      tags: [Reservations]
      summary: A reservation of this partner's was cancelled
      description: |
        **Status: planned, not yet deployed.**

        Fired when one of this partner's reservations is cancelled —
        including a cancellation made from the GlampSys admin panel, not only
        `POST /reservations/{id}/cancel`. A cancellation the partner's own
        API call caused is **not** re-delivered as a webhook to that same
        partner; you already know about it from the call's response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCancelledEvent"
            example:
              event_id: evt_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              event_type: reservation.cancelled
              created_at: "2026-09-10T09:00:00.000Z"
              data:
                reservation_id: res_01J9Z8QXG3K4M5N6P7Q8R9S0T1
                partner_reservation_id: GCZ-ORDER-99182
                unit_id: unit_123
                check_in: "2026-10-01"
                check_out: "2026-10-04"
                cancellation_fee_minor: 0
                currency: CZK
                cancelled_at: "2026-09-10T09:00:00.000Z"
      responses:
        "200":
          description: Acknowledged. Any 2xx counts as delivered.
        "400":
          description: Rejected by the partner's endpoint. GlampSys retries
            per the delivery's retry schedule (not on `408`/`429`, which are
            treated as transient and retried too — this is only the case
            where the partner's own validation refused the payload).

  reservation.modified:
    post:
      operationId: webhookReservationModified
      x-status: planned
      tags: [Reservations]
      summary: A reservation of this partner's was modified
      description: |
        **Status: planned, not yet deployed.**

        Fired when a reservation's dates, unit or guest count change —
        including a change made from the GlampSys admin panel. As with
        `reservation.cancelled`, a change caused by this same partner's own
        `POST /reservations/{id}/modify` call is not re-delivered to them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationModifiedEvent"
            example:
              event_id: evt_01J9Z8QXG3M0P1Q2R3S4T5V6W7
              event_type: reservation.modified
              created_at: "2026-09-10T09:10:00.000Z"
              data:
                reservation_id: res_01J9Z8QXG3K4M5N6P7Q8R9S0T1
                partner_reservation_id: GCZ-ORDER-99182
                unit_id: unit_123
                check_in: "2026-10-02"
                check_out: "2026-10-05"
                previous:
                  unit_id: unit_123
                  check_in: "2026-10-01"
                  check_out: "2026-10-04"
      responses:
        "200":
          description: Acknowledged. Any 2xx counts as delivered.
        "400":
          description: Rejected by the partner's endpoint. GlampSys retries
            per the delivery's retry schedule.

  availability.changed:
    post:
      operationId: webhookAvailabilityChanged
      x-status: planned
      tags: [ARI]
      summary: Availability changed for one or more of the partner's units
      description: |
        **Status: planned, not yet deployed.**

        Fired after a hold, a hold's expiry, a booking, a cancellation, or a
        manual block changes what `GET /ari` would return for a unit.
        Deliveries are coalesced per partner and per unit within a short
        window, so a burst of holds produces one webhook covering the whole
        affected date range, not one per change — treat `from`/`to` as "re-pull
        `GET /ari` for this unit across this range", not as an exhaustive
        list of the days that changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityChangedEvent"
            example:
              event_id: evt_01J9Z8QXG3P8Q9R0S1T2U3V4W5
              event_type: availability.changed
              created_at: "2026-09-10T09:15:00.000Z"
              data:
                unit_id: unit_123
                from: "2026-10-01"
                to: "2026-10-05"
      responses:
        "200":
          description: Acknowledged. Any 2xx counts as delivered.
        "400":
          description: Rejected by the partner's endpoint. GlampSys retries
            per the delivery's retry schedule.

components:
  securitySchemes:
    partnerToken:
      type: http
      scheme: bearer
      bearerFormat: gsp_live_… / gsp_test_…
      description: |
        A partner access token, sent as `Authorization: Bearer <token>`.
        Production tokens start `gsp_live_`, sandbox tokens `gsp_test_`. The
        two are separate credentials for separate environments, not the same
        token in two formats — see the introduction.

  parameters:
    PartnerReservationIdPath:
      name: partner_reservation_id
      in: path
      required: true
      description: The `partner_reservation_id` returned by
        `POST /reservations/confirm` (the value you sent in the confirm
        request, echoed back — not the GlampSys-internal `reservation_id`).
      schema:
        type: string
        example: GCZ-ORDER-99182

  headers:
    RequestId:
      description: Correlation id for this request. Always present, on
        success and on error; error bodies repeat it as `error.request_id`.
      schema:
        type: string
        example: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 42
    IdempotentReplayed:
      description: Present, with the value `true`, when this response is the
        stored response of an earlier request with the same
        `Idempotency-Key` rather than the result of processing this one.
        Absent otherwise.
      schema:
        type: string
        enum: ["true"]
    ETag:
      description: Opaque fingerprint of the response body. Send back as
        `If-None-Match` to get `304 Not Modified` when nothing changed.
      schema:
        type: string
        example: '"a1b2c3d4e5f6a7b8"'
    CacheControl:
      description: Safe to cache for up to 5 minutes; scoped to this token
        (`private`), never a shared cache.
      schema:
        type: string
        example: private, max-age=300
    CacheControlShort:
      description: Safe to cache for up to 60 seconds; scoped to this token
        (`private`), never a shared cache.
      schema:
        type: string
        example: private, max-age=60

  responses:
    BadRequest:
      description: The request is malformed or fails validation — a missing
        required field, a date range that doesn't make sense, a value out of
        range. Also covers a missing `Idempotency-Key`
        (`IDEMPOTENCY_KEY_REQUIRED`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_REQUEST
              message: "check_out must be after check_in."
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    Unauthorized:
      description: The bearer token is missing, unrecognized, or revoked.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Missing or invalid access token.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    Forbidden:
      description: The token is valid but access is closed right now — the
        partner account is paused, the request's source IP is outside the
        partner's allow-list, or the unit's location has been paused by its
        owner.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: Partner account is temporarily paused.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    NotFound:
      description: The requested resource does not exist, or exists but is
        not reachable by this partner (the two are indistinguishable on
        purpose — a partner is never told that an id belonging to someone
        else exists).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: Resource not found.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    Conflict:
      description: The request conflicts with the resource's current state
        (e.g. trying to modify a reservation that is already `cancelled` or
        `completed`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CONFLICT
              message: Reservation is already cancelled and cannot be modified.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    CancelConflict:
      description: |
        The reservation was not cancelled — `error.code` says why:

        - `CONFLICT` with `details.reason = RESERVATION_COMPLETED` — the stay
          is over (`status: completed`); nothing changed.
        - `IDEMPOTENCY_KEY_REUSED` — the key was used for a different request
          (another reservation or another body), or the original request is
          still running (`details.state = in_progress`).

        An already cancelled reservation is not a conflict: cancelling it
        again returns `200` with its current state.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: CONFLICT
              message: The stay is over; a completed reservation cannot be cancelled.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              details:
                reason: RESERVATION_COMPLETED
                status: completed
    Unavailable:
      description: The unit cannot be sold for the whole requested date range
        (`UNAVAILABLE` — booked, blocked or held, or with
        `details.reason = PRICE_NOT_CONFIGURED` when the operator has not
        priced some of the nights). Also returned when the
        `Idempotency-Key` was already used for a different request, or the
        original request with that key is still being processed
        (`IDEMPOTENCY_KEY_REUSED`, the latter with
        `details.state = in_progress`).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAVAILABLE
              message: Unit is not available for the requested dates.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    QuoteAlreadyUsed:
      description: The quote was already confirmed into a reservation (or
        already cancelled), so it can no longer be cancelled or confirmed
        again.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: QUOTE_ALREADY_USED
              message: Quote was already confirmed into a reservation.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
    ConfirmConflict:
      description: |
        The reservation was not created because of the state of the quote,
        the inventory or the payment — `error.code` says which:

        - `QUOTE_ALREADY_USED` — the quote was already confirmed into a
          reservation (by a request with a different `Idempotency-Key`).
        - `CONFLICT` — your account already has a reservation with this
          `partner_reservation_id` (`details.reason =
          DUPLICATE_PARTNER_RESERVATION_ID`).
        - `PRICE_MISMATCH` — `payment.currency` is not the quote's currency
          (`details.expected_currency`, `details.received_currency`), or
          `payment.total_price_minor` is outside your tolerance
          (`details.expected_total_minor`, `details.received_total_minor`,
          `details.tolerance_minor`, `details.currency`).
        - `UNAVAILABLE` — the stay can no longer be sold:
          `details.reason = HOLD_EXPIRED` (late payment after the hold
          expired and the dates are gone) or `SALES_PAUSED` (the owner
          paused sales over the dates).
        - `IDEMPOTENCY_KEY_REUSED` — the key was used for a different request,
          or the original request is still running
          (`details.state = in_progress`).

        In every case nothing was created and nothing was charged by
        GlampSys; refund the guest where the guest already paid you.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAVAILABLE
              message: The hold expired and the dates were sold in the meantime.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              details:
                reason: HOLD_EXPIRED
    Gone:
      description: The quote can no longer be confirmed — its hold expired
        more than 24 hours ago (`details.status = expired`), or you released
        it with `DELETE /quotes/{quote_id}` (`details.status = cancelled`).
        Nothing was created; refund the guest or start over with a new
        quote.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: QUOTE_EXPIRED
              message: The quote's hold expired more than 24 hours ago.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              details:
                status: expired
                expires_at: "2026-09-10T08:30:00.000Z"
    UnprocessableEntity:
      description: Syntactically valid but rejected by a business rule —
        `error.details.rule` says which one (`CURRENCY`, `CAPACITY`,
        `BOOKING_WINDOW`, `OUT_OF_SEASON`, `ARRIVAL_DAY`, `DEPARTURE_DAY`,
        `MIN_STAY`), and the rest of `details` carries the rule's limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: BUSINESS_RULE_VIOLATION
              message: The stay is shorter than the minimum stay for these dates.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              details:
                rule: MIN_STAY
                min_nights: 2
    PayloadTooLarge:
      description: Request body exceeds the 64 kB limit.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              message: Request body exceeds 64 kB.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              details:
                max_bytes: 65536
    TooManyRequests:
      description: >-
        Rate limit exceeded for this endpoint's class (read, quote, or write;
        `details.class`) — or, on `POST /quotes` with `hold: true`, a hold cap
        reached (`details.rule = HOLD_LIMIT`, `details.scope` = `partner` or
        `unit`). Respect `Retry-After`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Respect the Retry-After header.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1
              details:
                class: quote
                limit: 300
    ServiceUnavailable:
      description: A downstream dependency (e.g. the pricing engine) is
        temporarily unavailable. Safe to retry after `Retry-After` seconds.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: TEMPORARILY_UNAVAILABLE
              message: Pricing is temporarily unavailable. Retry shortly.
              request_id: req_01J9Z8QXG3K4M5N6P7Q8R9S0T1

