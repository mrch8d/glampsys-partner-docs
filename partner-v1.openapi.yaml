  schemas:
    # ── Shared primitives ────────────────────────────────────────────────
    DateQueryParam:
      type: string
      description: Calendar date, `YYYY-MM-DD`.
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: "2026-10-01"

    IdempotencyKeyValue:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[\x20-\x7E]+$'
      description: Unique per logical write attempt. Reuse it to retry the
        exact same attempt; a new attempt needs a new key. Printable ASCII
        only (`0x20`–`0x7E`); see the introduction's Idempotency section.
      example: gcz-checkout-99182-confirm

    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          description: Minor units — haléře for CZK, cents for EUR.
        currency:
          $ref: "#/components/schemas/Currency"

    Currency:
      type: string
      enum: [CZK, EUR]

    Guests:
      type: object
      required: [adults, children, pets]
      properties:
        adults:
          type: integer
          minimum: 1
        children:
          type: array
          description: One entry per child, each their age in whole years
            on the arrival day. Ages can change the price where the operator
            prices by the number and ages of guests.
          items:
            type: integer
            minimum: 0
            maximum: 17
        pets:
          type: integer
          minimum: 0
          description: Number of dogs. Accepted but never priced in v1 — it
            only sets the reservation's "has dog" flag.

    GuestContact:
      type: object
      required: [first_name, last_name, email, phone, language]
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        language:
          type: string
          description: ISO 639-1 language code for guest-facing communication
            GlampSys itself sends after confirmation (see the introduction —
            GlampSys never emails a guest before confirmation).
          example: cs

    Consents:
      type: object
      required: [terms, gdpr, accepted_at, source]
      properties:
        terms:
          type: boolean
          description: The guest accepted the property's terms. Must be
            `true` on `POST /reservations/confirm`.
        gdpr:
          type: boolean
          description: The guest was informed about the processing of their
            personal data. Must be `true` on `POST /reservations/confirm`.
        accepted_at:
          type: string
          description: When the guest accepted, at the partner's checkout —
            not when this API call was made. ISO 8601 timestamp with a time
            zone, e.g. `2026-09-10T08:04:30Z`.
        source:
          type: string
          description: Free-text identifier of where consent was captured,
            e.g. `glamping_cz_checkout`.
        terms_url:
          type: [string, "null"]
          format: uri
        cancellation_policy_url:
          type: [string, "null"]
          format: uri

    CancellationRule:
      type: object
      required: [days_before_checkin, charge_percent]
      properties:
        days_before_checkin:
          type: integer
        charge_percent:
          type: number

    CancellationMilestone:
      type: object
      required: [days_before_checkin, charge_percent, charge_minor, from, until]
      description: |
        One band of the cancellation policy. Bands are listed in time order
        and are contiguous to the millisecond: each band's `from` is the
        previous band's `until` plus one millisecond. `from` and `until` are
        both inclusive; cancelling at instant `t` costs the band with
        `from <= t <= until` (a `null` end is open).

        The instants are computed exactly the way the cancellation fee is
        computed when a reservation is cancelled: from midnight UTC of the
        check-in day, counting whole 24-hour days. A band listed with
        `days_before_checkin: 7` therefore ends at check-in day 00:00 UTC
        minus 7 × 24 hours — not at Prague midnight.
      properties:
        days_before_checkin:
          type: [integer, "null"]
          description: The property's rule this band comes from — it applies
            while at least this many whole days remain. `null` for the band
            no configured rule covers (100 % once the last rule's window has
            passed; 0 % for the single band of a property with no rules).
        charge_percent:
          type: number
        charge_minor:
          type: integer
          description: What cancelling inside this band costs, in the quote's
            currency — `charge_percent` of `total_price_minor`, rounded to the
            minor unit.
        from:
          type: [string, "null"]
          description: First instant of the band (ISO 8601 UTC, inclusive).
            `null` = the band has no start (it already applies when the
            quote is created, unless a later band has begun).
        until:
          type: [string, "null"]
          description: Last instant of the band (ISO 8601 UTC, inclusive).
            `null` = the band never ends.

    LocalTax:
      type: object
      required: [mode, per_person_per_night_minor]
      properties:
        mode:
          type: string
          enum: [in_price, on_site]
          description: '`in_price` — already included in `total_price_minor`
            as a `local_tax` breakdown line. `on_site` — the property
            collects it from the guest directly; not included in any price
            this API returns.'
        per_person_per_night_minor:
          type: integer

    PropertyRef:
      type: object
      required: [property_id, name, slug]
      properties:
        property_id:
          type: string
          example: prop_7
        name:
          type: string
        slug:
          type: string

    # ── Units (GET /units — deployed) ─────────────────────────────────────
    Unit:
      type: object
      required:
        - unit_id
        - partner_unit_id
        - property
        - name
        - max_guests
        - beds
        - inventory
        - season
        - conditions
        - active
      properties:
        unit_id:
          type: string
          description: Opaque GlampSys identifier. Stable for the life of
            the unit.
          example: unit_123
        partner_unit_id:
          type: string
          description: The identifier this partner uses for the unit in
            their own system, as configured by the property owner. Use this,
            not `unit_id`, to key your own listing.
        property:
          $ref: "#/components/schemas/PropertyRef"
        name:
          type: string
        max_guests:
          type: integer
        beds:
          type: integer
        inventory:
          type: object
          required: [mode, quantity]
          properties:
            mode:
              type: string
              enum: [individual, pool]
              description: '`individual` — one physical unit. `pool` — a
                listing of `quantity` interchangeable units; GlampSys tracks
                stock, not which physical unit is assigned.'
            quantity:
              type: integer
        season:
          type: object
          required: [seasonal, from, to]
          properties:
            seasonal:
              type: boolean
            from:
              type: [string, "null"]
              pattern: '^\d{2}-\d{2}$'
              description: '`MM-DD`, recurring every year. `null` when
                `seasonal` is `false`.'
              example: "04-01"
            to:
              type: [string, "null"]
              pattern: '^\d{2}-\d{2}$'
              example: "10-31"
        conditions:
          type: object
          required:
            - check_in_time
            - check_out_time
            - default_min_stay
            - booking_window_months
            - allowed_checkin_weekdays
            - allowed_checkout_weekdays
            - cancellation_rules
            - terms_url
            - terms_text
            - cancellation_policy_url
            - cancellation_policy_text
            - local_tax
          properties:
            check_in_time:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d$'
              example: "15:00"
            check_out_time:
              type: string
              pattern: '^([01]\d|2[0-3]):[0-5]\d$'
              example: "10:00"
            default_min_stay:
              type: integer
              description: Nights. `GET /ari` may report a higher effective
                minimum for a specific date due to a rate or a gap-fill rule.
            booking_window_months:
              type: integer
              description: How many months ahead this unit can be booked,
                clamped to 1–24.
            allowed_checkin_weekdays:
              type: [array, "null"]
              description: ISO 8601 weekdays (`1` = Monday … `7` = Sunday)
                arrival is allowed on. `null` means every day is allowed.
              items:
                type: integer
                minimum: 1
                maximum: 7
            allowed_checkout_weekdays:
              type: [array, "null"]
              description: Same convention as `allowed_checkin_weekdays`,
                for departure.
              items:
                type: integer
                minimum: 1
                maximum: 7
            cancellation_rules:
              type: array
              description: Empty array if the property has none configured.
              items:
                $ref: "#/components/schemas/CancellationRule"
            terms_url:
              type: [string, "null"]
              format: uri
              description: Set when the property's terms are a URL. Exactly
                one of `terms_url` / `terms_text` is non-null.
            terms_text:
              type: [string, "null"]
              description: Set when the property's terms are inline text
                rather than a URL.
            cancellation_policy_url:
              type: [string, "null"]
              format: uri
            cancellation_policy_text:
              type: [string, "null"]
            local_tax:
              $ref: "#/components/schemas/LocalTax"
        active:
          type: boolean
          description: >-
            Whether the property owner currently has this unit's mapping
            switched on. Always `true` in practice — an inactive mapping is
            simply omitted from the response, not returned with `active:
            false`; the field exists so a client that stores this payload
            can trust it without re-deriving the meaning of absence.

    UnitsListResponse:
      type: object
      required: [units, generated_at]
      properties:
        units:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        generated_at:
          type: string
          description: When this response was generated, ISO 8601 UTC. Not
            part of the `ETag` — do not use it to decide whether to re-fetch.

    # ── Meta (GET /ping — deployed) ───────────────────────────────────────
    PingResponse:
      type: object
      required: [partner, environment, unit_count, request_id, generated_at]
      properties:
        partner:
          type: string
          description: The partner's slug.
        environment:
          $ref: "#/components/schemas/Environment"
        unit_count:
          type: integer
          description: How many units `GET /units` would currently return.
        request_id:
          type: string
        generated_at:
          type: string
          description: ISO 8601 UTC.

    Environment:
      type: string
      enum: [sandbox, production]

    # ── ARI (GET /ari — deployed) ──────────────────────────────────────────
    AriDayUnavailableReason:
      type: string
      enum: [CURRENCY_NOT_ENABLED]
      description: Why `price` is `null` even though a value might otherwise
        be expected. Currently only one reason exists — EUR was requested
        (implicitly, via the partner line's configured currency) but the
        line has no fixed exchange rate — but treat this as an open enum;
        new reasons may be added.

    AriDay:
      type: object
      required:
        - date
        - available
        - available_count
        - min_stay
        - arrival_allowed
        - departure_allowed
        - price
        - price_unavailable_reason
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: |
            Calendar day, `YYYY-MM-DD`. Deliberately declared with a pattern
            instead of `format: date` — see this file's header on dates and
            timestamps for why.
          example: "2026-10-01"
        available:
          type: boolean
          description: Whether at least one unit of this listing can start a
            stay on this date, subject to `min_stay`.
        available_count:
          type: integer
          description: Remaining pool stock for this date. `1` (not `0`) for
            an `individual` unit that is free; `0` when unavailable.
        min_stay:
          type: integer
          description: Effective minimum nights for a stay starting this
            date — the unit's configured minimum, raised by the active rate
            or lowered by a single-night gap-fill, whichever applies.
        arrival_allowed:
          type: boolean
        departure_allowed:
          type: boolean
        price:
          description: Price for one night starting this date, in the
            currency `GET /ari` was called with. `null` when `available` is
            `false`, or per `price_unavailable_reason`.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        price_unavailable_reason:
          oneOf:
            - $ref: "#/components/schemas/AriDayUnavailableReason"
            - type: "null"

    AriUnit:
      type: object
      required: [unit_id, days]
      properties:
        unit_id:
          type: string
        days:
          type: array
          items:
            $ref: "#/components/schemas/AriDay"

    AriResponse:
      type: object
      required: [units, generated_at]
      properties:
        units:
          type: array
          items:
            $ref: "#/components/schemas/AriUnit"
        generated_at:
          type: string

    # ── Quotes (POST /quotes, GET + DELETE /quotes/{id} — deployed) ─────────
    CreateQuoteBody:
      type: object
      required: [unit_id, check_in, check_out, guests, hold]
      properties:
        unit_id:
          type: string
          description: '`unit_id` from `GET /units`, or your own
            `partner_unit_id` — either form is accepted.'
        check_in:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Arrival day, `YYYY-MM-DD` (a real calendar date).
          example: "2026-10-01"
        check_out:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Departure day, `YYYY-MM-DD` — after `check_in`, at most
            366 nights later. The departure day itself is not a night of the
            stay; another guest can arrive that day.
          example: "2026-10-04"
        guests:
          $ref: "#/components/schemas/Guests"
        currency:
          allOf:
            - $ref: "#/components/schemas/Currency"
          default: CZK
          description: '`EUR` is only priced when the unit''s line has EUR
            enabled with a fixed exchange rate; anywhere else the request is
            refused with `422 BUSINESS_RULE_VIOLATION` and
            `details.rule = CURRENCY` — never silently priced in CZK.'
        hold:
          type: boolean
          description: '`true` reserves the inventory for a short window and
            requires `Idempotency-Key`. `false` returns a price only — no
            state is created and the response''s `quote_id` is `null`.'
        guest:
          description: 'Optional with `hold: true` — the guest you already
            know from your checkout form. The operator sees the name on the
            hold in their calendar; nothing else is created from it (the
            reservation''s guest is the one you send to confirm), and it is
            erased 24 hours after the quote expires or is released. Never
            echoed back in a response. Must be absent or `null` with
            `hold: false` (`400 INVALID_REQUEST`): there is no reason to send
            personal data for a price check.'
          oneOf:
            - $ref: "#/components/schemas/GuestContact"
            - type: "null"
        partner_reservation_reference:
          type: string
          maxLength: 255
          description: The partner's own free-text order/tracking id. Stored
            with a held quote and echoed back in
            `Reservation.partner_reservation_reference` if this quote is
            later confirmed — purely for the partner's own
            cross-referencing, GlampSys does not interpret it.

    QuoteStatus:
      type: string
      enum: [held, priced, expired, cancelled, confirmed]

    QuoteBreakdownItemType:
      type: string
      enum: [accommodation, promotion, local_tax]

    QuoteBreakdownItem:
      type: object
      required: [type, label, amount_minor]
      properties:
        type:
          $ref: "#/components/schemas/QuoteBreakdownItemType"
        label:
          type: string
          description: Human-readable, safe to show to the guest as-is.
        amount_minor:
          type: integer
          description: Can be negative for `promotion`.

    QuoteNightlyItem:
      type: object
      required: [date, amount_minor, rate_type]
      properties:
        date:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: The night starting this day, `YYYY-MM-DD`.
        amount_minor:
          type: integer
          description: That night's price with your markup, in the quote's
            currency — before promotions, without local tax.
        rate_type:
          type: string
          description: Free-text label of which rate priced this night, e.g.
            `weekday`, `weekend`, `holiday`. Treat as informational — do not
            branch logic on specific values, new ones can appear.

    Quote:
      type: object
      required:
        - quote_id
        - status
        - unit_id
        - partner_unit_id
        - check_in
        - check_out
        - nights
        - currency
        - fx_rate
        - guests
        - breakdown
        - nightly
        - taxes
        - total_price_minor
        - cancellation_milestones
        - hold_ttl_seconds
        - expires_at
        - created_at
      properties:
        quote_id:
          description: '`null` when this quote was created with `hold: false`
            (nothing to reference later).'
          oneOf:
            - type: string
            - type: "null"
        status:
          $ref: "#/components/schemas/QuoteStatus"
        unit_id:
          type: string
        partner_unit_id:
          type: [string, "null"]
          description: Your identifier for the unit, when one is mapped
            (sandbox demo units may have none).
        check_in:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        check_out:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        nights:
          type: integer
        currency:
          $ref: "#/components/schemas/Currency"
        fx_rate:
          description: CZK per one unit of `currency`, fixed at quote
            creation time. `null` when `currency` is `CZK`.
          oneOf:
            - type: number
            - type: "null"
        guests:
          $ref: "#/components/schemas/Guests"
        breakdown:
          type: array
          description: Sums to `total_price_minor`. `accommodation` (the
            nights with your markup), `promotion` (an automatic promotion with
            your markup; negative for a discount, positive for a surcharge;
            absent when none applies) and `local_tax` (only when
            `taxes.local_tax.included` is `true` and the tax is not zero).
          items:
            $ref: "#/components/schemas/QuoteBreakdownItem"
        nightly:
          type: array
          items:
            $ref: "#/components/schemas/QuoteNightlyItem"
        taxes:
          type: object
          required: [local_tax]
          properties:
            local_tax:
              type: object
              required: [included, collected_by, amount_minor, per_person_per_night_minor]
              properties:
                included:
                  type: boolean
                  description: Mirrors the unit's `local_tax.mode` —
                    `true` when it is already inside `total_price_minor` (as
                    a `local_tax` breakdown line), `false` when the property
                    collects it on site and this amount is informational.
                collected_by:
                  type: string
                  enum: [partner, property_on_site]
                  description: Who collects the tax from the guest — you
                    (inside the price you charge) or the property on arrival.
                amount_minor:
                  type: integer
                  description: '`per_person_per_night` × all guests (adults
                    and children) × nights, in the quote''s currency. Never
                    marked up.'
                per_person_per_night_minor:
                  type: integer
        total_price_minor:
          type: integer
        cancellation_milestones:
          type: array
          description: What cancelling would cost at each policy milestone,
            evaluated from `check_in`. Sourced from the exact same clock
            arithmetic `POST /reservations/{id}/cancel` uses, so these
            numbers are what will actually be charged, not an approximation.
            All bands are listed, including those that already lie in the
            past when the quote is created.
          items:
            $ref: "#/components/schemas/CancellationMilestone"
        hold_ttl_seconds:
          type: [integer, "null"]
          description: How long this hold lasts from creation. `null` unless
            `status` is `held`.
        expires_at:
          type: [string, "null"]
          description: >-
            When the hold releases on its own, ISO 8601 UTC. `null` when this
            quote was created with `hold: false`, or once `status` is no
            longer `held`.
        created_at:
          type: string
          description: ISO 8601 UTC.

    # ── Reservations (confirm, lookup, list — deployed since 1.3.0) ─────────
    ReservationGuest:
      type: object
      required: [first_name, last_name, email, phone, language]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 40
        language:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: ISO 639-1 language code (`cs`, `en`, `de`…) — the
            language of the emails GlampSys itself sends the guest after
            confirmation.
          example: cs
        nationality:
          type: [string, "null"]
          pattern: '^[A-Za-z]{2}$'
          description: ISO 3166-1 alpha-2 country code, when you know it.
            Optional — GlampSys collects the guest's documents itself in the
            online check-in.
          example: CZ

    ReservationPayment:
      type: object
      required: [status, total_price_minor, currency, paid_at]
      description: What the guest actually paid you for this stay.
      properties:
        status:
          type: string
          enum: [paid]
          description: Only `paid` is supported — confirm once the guest has
            paid you in full.
        total_price_minor:
          type: integer
          minimum: 0
          description: The amount the guest paid, in minor units of
            `currency`. Compared with the quote's `total_price_minor`
            (see the operation description).
        currency:
          $ref: "#/components/schemas/Currency"
        paid_at:
          type: string
          description: When the guest paid you, ISO 8601 timestamp with a
            time zone.
          example: "2026-09-10T08:04:52Z"

    ConfirmReservationBody:
      type: object
      required: [quote_id, partner_reservation_id, guest, consents, payment]
      properties:
        quote_id:
          type: string
          description: >-
            The `quote_id` of a quote you created with `hold: true`.
            (Confirming without a quote is not available in this version.)
        partner_reservation_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Your own id for this reservation — unique within your
            account. It is the id you use afterwards in
            `GET /reservations/{partner_reservation_id}` and the `/modify`
            and `/cancel` paths, so it may only contain letters, digits and
            `.`, `_`, `:`, `-`.
          example: GCZ-938482
        partner_reservation_reference:
          type: string
          maxLength: 255
          description: Optional free-text order/tracking id of yours. When
            sent it replaces the one stored with the quote; echoed back as
            `Reservation.partner_reservation_reference`. GlampSys does not
            interpret it.
        guest:
          $ref: "#/components/schemas/ReservationGuest"
        consents:
          $ref: "#/components/schemas/Consents"
        payment:
          $ref: "#/components/schemas/ReservationPayment"
        notes:
          type: [string, "null"]
          maxLength: 2000
          description: The guest's message to the property (arrival time,
            wishes). Shown to the property's staff.

    ReservationStatus:
      type: string
      enum: [confirmed, modified, cancelled, completed]

    Reservation:
      type: object
      required:
        - reservation_id
        - partner_reservation_id
        - partner_reservation_reference
        - booking_code
        - status
        - quote_id
        - unit_id
        - partner_unit_id
        - property
        - check_in
        - check_out
        - nights
        - guests
        - currency
        - total_price_minor
        - fx_rate
        - breakdown
        - cancellation_fee_minor
        - cancelled_at
        - guest_portal_url
        - created_at
        - updated_at
      properties:
        reservation_id:
          type: string
          description: GlampSys's own opaque, permanently unique id
            (`res_<ULID>`). Prefer this over `booking_code` for any stored
            reference — `booking_code` is a human-facing label, not
            guaranteed unique across the whole platform.
          example: res_01J9Z8QXG3K4M5N6P7Q8R9S0T1
        partner_reservation_id:
          type: string
          description: The `partner_reservation_id` you sent in
            `POST /reservations/confirm`.
        partner_reservation_reference:
          type: [string, "null"]
          description: Your free-text reference from the confirm request,
            or else from the quote; `null` when you sent none.
        booking_code:
          type: string
          description: Human-readable label shown in the GlampSys admin
            panel and on guest documents. Informative only — see
            `reservation_id`.
        status:
          $ref: "#/components/schemas/ReservationStatus"
        quote_id:
          type: [string, "null"]
          description: The quote this reservation was confirmed from.
        unit_id:
          type: string
          description: The unit the reservation is on now (the operator may
            have moved it — then `status` is `modified`).
        partner_unit_id:
          type: [string, "null"]
          description: Your identifier for that unit, when one is mapped.
        property:
          $ref: "#/components/schemas/PropertyRef"
        check_in:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        check_out:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        nights:
          type: integer
        guests:
          $ref: "#/components/schemas/Guests"
        currency:
          $ref: "#/components/schemas/Currency"
        total_price_minor:
          type: integer
          description: The price you confirmed, in `currency` — the quote's
            total.
        fx_rate:
          description: CZK per one unit of `currency`, fixed by the quote.
            `null` when `currency` is `CZK`.
          oneOf:
            - type: number
            - type: "null"
        breakdown:
          type: array
          description: The quote's price lines; they sum to
            `total_price_minor`.
          items:
            $ref: "#/components/schemas/QuoteBreakdownItem"
        cancellation_fee_minor:
          type: [integer, "null"]
          description: Once `status` is `cancelled`, the cancellation fee
            GlampSys recorded, in `currency` — for a cancellation you made
            with `POST /reservations/{partner_reservation_id}/cancel`,
            exactly the amount that call returned. `null` otherwise.
            GlampSys never collects it from the guest.
        cancelled_at:
          type: [string, "null"]
          description: When the reservation was cancelled, ISO 8601 UTC;
            `null` unless cancelled.
        guest_portal_url:
          type: string
          description: The guest's online check-in portal. Safe to hand
            directly to the guest, e.g. in your own confirmation email.
        created_at:
          type: string
          description: ISO 8601 UTC.
        updated_at:
          type: string
          description: Last change of the reservation record, ISO 8601 UTC —
            the value `GET /reservations?updated_since=` filters on.

    ReservationsListResponse:
      type: object
      required: [reservations, next_cursor]
      properties:
        reservations:
          type: array
          items:
            $ref: "#/components/schemas/Reservation"
        next_cursor:
          type: [string, "null"]
          description: Pass as `cursor` to get the next page; `null` on the
            last page.

    # ── Reservations: modify (planned), cancel ─────────────────────────────
    ModifyReservationBody:
      type: object
      required: [quote_id]
      properties:
        quote_id:
          type: string
          description: A quote created with this reservation's
            `partner_reservation_id` as `modifies_partner_reservation_id`.

    CancelReservationBody:
      type: object
      properties:
        reason:
          type: string
          maxLength: 500
          description: Free-text, for GlampSys's own records (e.g.
            `guest_request`). Never shown to guests or property staff
            verbatim. Optional; the body itself is optional.

    # ── Webhooks (planned) ─────────────────────────────────────────────────
    # Each event below inlines its own single-value `event_type` enum rather
    # than sharing one three-value enum — a partner integrating just
    # `availability.changed` should never see `reservation.cancelled` show up
    # in that field's type.
    ReservationCancelledEvent:
      type: object
      required: [event_id, event_type, created_at, data]
      properties:
        event_id:
          type: string
          example: evt_01J9Z8QXG3K4M5N6P7Q8R9S0T1
        event_type:
          type: string
          enum: [reservation.cancelled]
        created_at:
          type: string
        data:
          type: object
          required:
            - reservation_id
            - partner_reservation_id
            - unit_id
            - check_in
            - check_out
            - cancellation_fee_minor
            - currency
            - cancelled_at
          properties:
            reservation_id:
              type: string
            partner_reservation_id:
              type: string
            unit_id:
              type: string
            check_in:
              type: string
              format: date
            check_out:
              type: string
              format: date
            cancellation_fee_minor:
              type: integer
            currency:
              $ref: "#/components/schemas/Currency"
            cancelled_at:
              type: string
              format: date-time

    ReservationModifiedEvent:
      type: object
      required: [event_id, event_type, created_at, data]
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum: [reservation.modified]
        created_at:
          type: string
        data:
          type: object
          required: [reservation_id, partner_reservation_id, unit_id, check_in, check_out, previous]
          properties:
            reservation_id:
              type: string
            partner_reservation_id:
              type: string
            unit_id:
              type: string
            check_in:
              type: string
              format: date
            check_out:
              type: string
              format: date
            previous:
              type: object
              description: The reservation's unit and dates immediately
                before this modification.
              required: [unit_id, check_in, check_out]
              properties:
                unit_id:
                  type: string
                check_in:
                  type: string
                  format: date
                check_out:
                  type: string
                  format: date

    AvailabilityChangedEvent:
      type: object
      required: [event_id, event_type, created_at, data]
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum: [availability.changed]
        created_at:
          type: string
        data:
          type: object
          required: [unit_id, from, to]
          properties:
            unit_id:
              type: string
            from:
              type: string
              format: date
              description: Coalesced range start — re-pull `GET /ari` for
                this unit from here.
            to:
              type: string
              format: date

    # ── Errors ───────────────────────────────────────────────────────────
    ErrorCode:
      type: string
      description: See the introduction's HTTP-status table for the fixed
        status code each of these maps to.
      enum:
        - INVALID_REQUEST
        - IDEMPOTENCY_KEY_REQUIRED
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - UNAVAILABLE
        - PRICE_MISMATCH
        - QUOTE_ALREADY_USED
        - IDEMPOTENCY_KEY_REUSED
        - CONFLICT
        - QUOTE_EXPIRED
        - BUSINESS_RULE_VIOLATION
        - RATE_LIMITED
        - PAYLOAD_TOO_LARGE
        - INTERNAL_ERROR
        - TEMPORARILY_UNAVAILABLE

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: For logs and humans. Do not pattern-match on it.
            request_id:
              type: string
            details:
              type: object
              description: |
                Present on some errors, shaped per `code`. Never contains a
                stack trace or SQL. The keys you can branch on:

                - `RATE_LIMITED`: `class` (`read`, `quote`, `write`) and
                  `limit` for a rate limit; `rule: HOLD_LIMIT`, `scope`
                  (`partner`, `unit`) and `limit` for a hold cap.
                - `BUSINESS_RULE_VIOLATION`: `rule` (`CURRENCY`, `CAPACITY`,
                  `BOOKING_WINDOW`, `OUT_OF_SEASON`, `ARRIVAL_DAY`,
                  `DEPARTURE_DAY`, `MIN_STAY`) plus that rule's limit.
                - `UNAVAILABLE`: `reason: PRICE_NOT_CONFIGURED` (with
                  `dates`) when some nights have no price; on
                  `POST /reservations/confirm` `reason: HOLD_EXPIRED` (late
                  payment, the dates are gone) or `reason: SALES_PAUSED`;
                  absent when the dates are simply taken.
                - `PRICE_MISMATCH`: `expected_currency` and
                  `received_currency`, or `expected_total_minor`,
                  `received_total_minor`, `tolerance_minor` and `currency`.
                - `QUOTE_EXPIRED`: `status` (`expired` or `cancelled`) and
                  `expires_at` of the quote's hold.
                - `CONFLICT`: `reason: DUPLICATE_PARTNER_RESERVATION_ID` when
                  the `partner_reservation_id` is already used.
                - `IDEMPOTENCY_KEY_REUSED`: `state: in_progress` while the
                  original request is still running; absent when the key was
                  used for a different request.
                - `NOT_FOUND`: `reason: UNKNOWN_ENDPOINT` for a path that
                  does not exist (yet).
                - `INVALID_REQUEST`: `field`, `parameter` or `header` naming
                  the offending input, when there is one.
              additionalProperties: true
